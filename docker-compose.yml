name: job-tracker

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: JOBTRACK101
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:JOBTRACK101@db:5432/job_tracker
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
